services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: https://${DOMAIN}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_MINI_MODEL: ${OPENAI_MINI_MODEL:-gpt-5.4-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEY_2: ${ANTHROPIC_API_KEY_2:-}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-90}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-AI Trainer}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-AI Trainer}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AI Trainer}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TLS_SERVER_HOSTNAME: ${SMTP_TLS_SERVER_HOSTNAME:-}
      SMTP_REQUIRED: "true"
      EMAIL_VERIFICATION_TOKEN_EXPIRE_HOURS: ${EMAIL_VERIFICATION_TOKEN_EXPIRE_HOURS:-24}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
    depends_on:
      - db
      - redis
      - smtp-proxy
    volumes:
      - ./backend/uploads:/app/uploads

  smtp-proxy:
    build: ./backend
    restart: unless-stopped
    network_mode: host
    command: python -m scripts.smtp_tcp_proxy
    environment:
      SMTP_PROXY_LISTEN_HOST: ${SMTP_PROXY_LISTEN_HOST:-172.18.0.1}
      SMTP_PROXY_LISTEN_PORT: ${SMTP_PROXY_LISTEN_PORT:-2525}
      SMTP_PROXY_TARGET_HOST: ${SMTP_PROXY_TARGET_HOST:-smtp.gmail.com}
      SMTP_PROXY_TARGET_PORT: ${SMTP_PROXY_TARGET_PORT:-587}
      SMTP_PROXY_TARGET_FAMILY: ${SMTP_PROXY_TARGET_FAMILY:-ipv6}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
      BACKEND_URL: http://backend:8000

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
      --email ${ADMIN_EMAIL} -d ${DOMAIN} -d www.${DOMAIN}
      --agree-tos --non-interactive --keep-until-expiring"

volumes:
  pgdata:
  certbot-www:
